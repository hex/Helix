name: Helix
options:
  bundleIdPrefix: com.hexul
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.35"
  xcodeVersion: "16.0"

packages:
  HelixKit:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.0"

targets:
  Helix:
    type: application
    platform: macOS
    preBuildScripts:
      - script: |
          if [ ! -f "$SRCROOT/RustDiff/target/release/libhelix_diff.a" ]; then
            echo "Building Rust diff library..."
            cd "$SRCROOT/RustDiff" && bash build.sh
          fi
        name: Build Rust Diff Library
        basedOnDependencyAnalysis: false
    sources:
      - path: App
    dependencies:
      - package: HelixKit
        product: HelixKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexul.Helix
        PRODUCT_NAME: Helix
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Helix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleDisplayName: Helix
        CFBundleName: Helix
        CFBundleShortVersionString: "2026.11.0"
        CFBundleVersion: "5"
        SUFeedURL: "https://raw.githubusercontent.com/hex/Helix/main/appcast.xml"
        SUPublicEDKey: "VJR0Igvi956+S07119jBXK+/rt1QjpUB//YJYx7ZAHs="
